name: Deploy Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.release.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Patch
        env:
          ACBD77: ${{ secrets.ACBD77 }}
          B78C8F: ${{ secrets.B78C8F }}
        run: |
          python3 -c "
          import os, pathlib, sys
          gm = os.environ.get('ACBD77', '')
          bm = os.environ.get('B78C8F', '')
          p = pathlib.Path('index.html')
          s = s2 = p.read_text(encoding='utf-8')
          if gm:
              s2 = s2.replace('<!-- 8fc9b8ada1cfd279e25bd7c3 -->', gm)
          if bm:
              s2 = s2.replace('<!-- 29fbbd66a0651e6b261a15f18311b61c017dd3d1 -->', bm)
          if s2 == s and (gm or bm):
              sys.exit(1)
          if s2 != s:
              p.write_text(s2, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: release
        uses: actions/deploy-pages@v4
